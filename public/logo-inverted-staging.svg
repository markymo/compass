<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 140">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&amp;display=swap');
            .logo-text { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 76px; letter-spacing: -2px; }
        </style>
    </defs>

    <g transform="translate(10, 5)">
        <!-- Mirrored Arc (White O-Ring for dark bg) -->
        <path d="M 28 48 A 38 38 0 1 0 62 27" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" />
        
        <!-- Power Stem (Staging Purple Vertical P-Spine) -->
        <line x1="60" y1="20" x2="60" y2="76" stroke="#9333ea" stroke-width="12" stroke-linecap="round" />
    </g>

    <!-- Text "OnPro" -->
    <text x="145" y="98" class="logo-text">
        <tspan fill="#9333ea">On</tspan><tspan fill="#ffffff">Pro</tspan>
    </text>
</svg>
