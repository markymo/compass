<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 140">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&amp;display=swap');
            .logo-text { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 76px; letter-spacing: -2px; }
        </style>
    </defs>

    <g transform="translate(10, 5)">
        <!-- Arc with Top Notch Gap (White O-Ring for dark bg) -->
        <path d="M 58 27 A 38 38 0 1 0 92 48" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" />
        
        <!-- Power Stem passing into the slot (Orange P-Line) -->
        <line x1="60" y1="20" x2="60" y2="72" stroke="#f97316" stroke-width="12" stroke-linecap="round" />
    </g>

    <!-- Text "OnPro" -->
    <text x="145" y="98" class="logo-text">
        <tspan fill="#f97316">On</tspan><tspan fill="#ffffff">Pro</tspan>
    </text>
</svg>
