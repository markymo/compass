<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 140">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&amp;display=swap');
            .logo-text { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 76px; letter-spacing: -2px; }
        </style>
    </defs>

    <g transform="translate(10, 5)">
        <!-- White Loop for dark bg -->
        <path d="M 35 45 C 18 45, 18 95, 52 95 C 75 95, 82 72, 82 60 C 82 45, 68 32, 52 32 C 40 32, 35 45, 35 45" 
              fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Orange Overlapping Arc -->
        <path d="M 52 32 C 75 32, 98 45, 98 65 C 98 88, 75 95, 60 95" 
              fill="none" stroke="#f97316" stroke-width="11" stroke-linecap="round" />
    </g>

    <!-- Text "OnPro" -->
    <text x="145" y="98" class="logo-text">
        <tspan fill="#f97316">On</tspan><tspan fill="#ffffff">Pro</tspan>
    </text>
</svg>
