<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 140">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&amp;display=swap');
            .logo-text { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 76px; letter-spacing: -2px; }
        </style>
    </defs>

    <g transform="translate(10, 5)">
        <!-- Navy O-Ring with left opening -->
        <path d="M 44 44 A 36 36 0 1 1 44 86" fill="none" stroke="#1d2b3a" stroke-width="11" stroke-linecap="round" />
        
        <!-- Left Vertical Power Spine (Orange P-stem) -->
        <line x1="38" y1="22" x2="38" y2="104" stroke="#f97316" stroke-width="12" stroke-linecap="round" />
    </g>

    <!-- Text "OnPro" -->
    <text x="145" y="98" class="logo-text">
        <tspan fill="#f97316">On</tspan><tspan fill="#1d2b3a">Pro</tspan>
    </text>
</svg>
